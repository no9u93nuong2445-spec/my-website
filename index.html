<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#7c3aed">
  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>心动训练营 V2.0</title>
  <style>
    :root{color-scheme:light dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f3ff;color:#231942}
    .box{width:min(616px,calc(100% - 32px));padding:28px;border-radius:24px;background:#fff;box-shadow:0 16px 50px #5b21b622}
    h1{margin:0 0 20px;font-size:clamp(28px,6vw,36px)}
    #msg{line-height:1.6;word-break:break-word}
    .bar{height:10px;border-radius:99px;background:#e9ddff;overflow:hidden}
    .bar i{display:block;width:8%;height:100%;background:#7c3aed;transition:width .25s}
    small{display:block;margin-top:20px;opacity:.72;line-height:1.6}
    button{margin-top:16px;border:0;border-radius:12px;padding:12px 18px;background:#7c3aed;color:#fff;font-weight:700;font-size:16px}
    @media(prefers-color-scheme:dark){body{background:#15111d;color:#f7f1ff}.box{background:#211a2d}.bar{background:#46385f}}
  </style>
</head>
<body>
  <main class="box">
    <h1>心动训练营 V2.0</h1>
    <p id="msg">正在读取完整训练程序……</p>
    <div class="bar"><i id="progress"></i></div>
    <small>首次载入后，关卡进度和聊天数据只保存在你的浏览器本地。</small>
    <button id="retry" type="button" hidden>重新载入</button>
  </main>
<script>
const msg=document.querySelector('#msg');
const bar=document.querySelector('#progress');
const retry=document.querySelector('#retry');

function fail(text){throw new Error(text)}

async function start(){
  retry.hidden=true;
  try{
    if(!('DecompressionStream' in window)){
      fail('浏览器版本过旧，请升级 Chrome、Edge 或 Safari 后再打开');
    }

    let encoded='';
    for(let i=1;i<=12;i++){
      msg.textContent=`正在读取训练程序 ${i}/12……`;
      bar.style.width=`${8+Math.round(i/12*62)}%`;
      const name=`webdata/part-${String(i).padStart(2,'0')}.txt?v=2005`;
      const response=await fetch(name,{cache:'no-store'});
      if(!response.ok) fail(`程序分块 ${i} 读取失败（HTTP ${response.status}）`);
      const part=(await response.text()).replace(/\s/g,'');
      if(!part || !/^[A-Za-z0-9+/=]+$/.test(part)) fail(`程序分块 ${i} 内容损坏`);
      encoded+=part;
    }

    if(encoded.length<120000 || encoded.length%4!==0){
      fail(`程序数据长度异常（${encoded.length}）`);
    }

    msg.textContent='正在校验训练程序……';
    bar.style.width='74%';
    let raw;
    try{raw=atob(encoded)}catch(error){fail('程序编码校验失败，请清除网站缓存后重试')}
    const compressed=Uint8Array.from(raw,char=>char.charCodeAt(0));
    if(compressed.length<90000 || compressed[0]!==0x1f || compressed[1]!==0x8b){
      fail(`程序压缩包不完整（${compressed.length}字节）`);
    }

    msg.textContent='正在解压训练内容……';
    bar.style.width='84%';
    const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    const htmlBytes=new TextEncoder().encode(html).length;
    if(htmlBytes<300000 || !html.includes('<html') || !html.includes('心动训练营') || !html.includes('自由练习')){
      fail(`训练页面校验失败（${htmlBytes}字节）`);
    }

    msg.textContent='载入完成';
    bar.style.width='100%';
    setTimeout(()=>{
      document.open();
      document.write(html);
      document.close();
    },60);
  }catch(error){
    console.error(error);
    msg.textContent='载入失败：'+error.message;
    retry.hidden=false;
  }
}

retry.addEventListener('click',start);
start();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#7c3aed">
  <title>心动训练营 V2.0</title>
  <style>
    :root{color-scheme:light dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f3ff;color:#231942}
    .box{width:min(616px,calc(100% - 32px));padding:28px;border-radius:24px;background:#fff;box-shadow:0 16px 50px #5b21b622}
    h1{margin:0 0 20px;font-size:clamp(28px,6vw,36px)}
    #msg{line-height:1.6;word-break:break-word}
    .bar{height:10px;border-radius:99px;background:#e9ddff;overflow:hidden}
    .bar i{display:block;width:10%;height:100%;background:#7c3aed;transition:width .25s}
    small{display:block;margin-top:20px;opacity:.72;line-height:1.6}
    button{margin-top:16px;border:0;border-radius:12px;padding:12px 18px;background:#7c3aed;color:#fff;font-weight:700;font-size:16px}
    @media(prefers-color-scheme:dark){body{background:#15111d;color:#f7f1ff}.box{background:#211a2d}.bar{background:#46385f}}
  </style>
</head>
<body>
  <main class="box">
    <h1>心动训练营 V2.0</h1>
    <p id="msg">正在读取离线训练程序……</p>
    <div class="bar"><i id="progress"></i></div>
    <small>训练内容加载完成后，关卡进度和聊天数据只保存在你的浏览器本地。</small>
    <button id="retry" type="button" hidden>重新载入</button>
  </main>
<script>
const msg=document.querySelector('#msg');
const bar=document.querySelector('#progress');
const retry=document.querySelector('#retry');

async function start(){
  retry.hidden=true;
  try{
    if(!('DecompressionStream' in window)){
      throw new Error('浏览器版本过旧，请升级 Chrome、Edge 或 Safari 后再打开');
    }
    msg.textContent='正在下载离线训练程序……';
    bar.style.width='35%';
    const response=await fetch('webdata/app.html.gz?v=2001',{cache:'no-store'});
    if(!response.ok) throw new Error('程序文件读取失败（HTTP '+response.status+'）');
    const compressed=await response.arrayBuffer();
    if(compressed.byteLength<50000) throw new Error('程序文件不完整，请稍后刷新重试');
    msg.textContent='正在解压训练内容……';
    bar.style.width='75%';
    const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    if(!html.includes('<html')||!html.includes('心动训练营')){
      throw new Error('训练页面校验失败');
    }
    msg.textContent='载入完成';
    bar.style.width='100%';
    setTimeout(()=>{
      document.open();
      document.write(html);
      document.close();
    },80);
  }catch(error){
    console.error(error);
    msg.textContent='载入失败：'+error.message;
    retry.hidden=false;
  }
}
retry.addEventListener('click',start);
start();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#7c3aed">
  <title>心动训练营 V2.0</title>
  <style>
    :root{color-scheme:light dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f3ff;color:#231942}
    .box{width:min(616px,calc(100% - 32px));padding:28px;border-radius:24px;background:#fff;box-shadow:0 16px 50px #5b21b622}
    h1{margin:0 0 20px;font-size:clamp(28px,6vw,36px)}
    #msg{line-height:1.6;word-break:break-word}
    .bar{height:10px;border-radius:99px;background:#e9ddff;overflow:hidden}
    .bar i{display:block;width:10%;height:100%;background:#7c3aed;transition:width .25s}
    small{display:block;margin-top:20px;opacity:.72;line-height:1.6}
    button{margin-top:16px;border:0;border-radius:12px;padding:12px 18px;background:#7c3aed;color:#fff;font-weight:700;font-size:16px}
    @media(prefers-color-scheme:dark){body{background:#15111d;color:#f7f1ff}.box{background:#211a2d}.bar{background:#46385f}}
  </style>
</head>
<body>
  <main class="box">
    <h1>心动训练营 V2.0</h1>
    <p id="msg">正在读取离线训练程序……</p>
    <div class="bar"><i id="progress"></i></div>
    <small>首次载入会读取12个程序分块。进入训练后，关卡进度和聊天数据只保存在你的浏览器本地。</small>
    <button id="retry" type="button" hidden>重新载入</button>
  </main>
<script>
const msg=document.querySelector('#msg');
const bar=document.querySelector('#progress');
const retry=document.querySelector('#retry');

function decodePart(value){
  const clean=value.replace(/\s/g,'');
  const raw=atob(clean);
  return Uint8Array.from(raw,char=>char.charCodeAt(0));
}

async function start(){
  retry.hidden=true;
  try{
    if(!('DecompressionStream' in window)){
      throw new Error('浏览器版本过旧，请升级 Chrome、Edge 或 Safari 后再打开');
    }

    const chunks=[];
    let total=0;
    for(let i=1;i<=12;i++){
      msg.textContent=`正在读取离线训练程序 ${i}/12……`;
      bar.style.width=`${10+Math.round(i/12*65)}%`;
      const name=`webdata/part-${String(i).padStart(2,'0')}.txt?v=2002`;
      const response=await fetch(name,{cache:'no-store'});
      if(!response.ok){
        throw new Error(`程序分块 ${i} 读取失败（HTTP ${response.status}）`);
      }
      const bytes=decodePart(await response.text());
      chunks.push(bytes);
      total+=bytes.length;
    }

    const compressed=new Uint8Array(total);
    let offset=0;
    for(const bytes of chunks){
      compressed.set(bytes,offset);
      offset+=bytes.length;
    }
    if(compressed.byteLength<90000){
      throw new Error('程序文件不完整，请稍后刷新重试');
    }

    msg.textContent='正在解压训练内容……';
    bar.style.width='82%';
    const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
    let html=await new Response(stream).text();
    if(!html.includes('<html')||!html.includes('心动训练营')){
      throw new Error('训练页面校验失败');
    }

    html=html.replace('</head>','<link rel="manifest" href="./manifest.json"><meta name="apple-mobile-web-app-capable" content="yes"></head>');
    msg.textContent='载入完成';
    bar.style.width='100%';
    setTimeout(()=>{
      document.open();
      document.write(html);
      document.close();
    },80);
  }catch(error){
    console.error(error);
    msg.textContent='载入失败：'+error.message;
    retry.hidden=false;
  }
}

retry.addEventListener('click',start);
start();
</script>
</body>
</html>

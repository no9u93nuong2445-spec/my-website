plugins { id 'com.android.application' }

android {
    namespace 'com.bianzhifeng.hearttraining'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bianzhifeng.hearttraining'
        minSdk 24
        targetSdk 35
        versionCode 200
        versionName '2.0.0'
    }

    sourceSets {
        main.assets.srcDirs = ['../../.bootstrap']
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

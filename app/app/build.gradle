import java.util.regex.Matcher
import java.util.regex.Pattern

plugins { id 'com.android.application' }

def repoRoot = projectDir.parentFile.parentFile
def generatedOfflineAssetsDir = layout.buildDirectory.dir('generated/offlineAssets')
def sourceIndex = new File(repoRoot, 'index.html')
def sourceCss = new File(repoRoot, 'style.css')
def sourceV219Overlay = new File(repoRoot, 'fragments/app-v219-overlay.txt')
def sourceV220Overlay = new File(repoRoot, 'fragments/app-v220-overlay.txt')
def sourceFragments = (1..16).collect { number ->
    new File(repoRoot, String.format('fragments/app-%02d.txt', number))
}

tasks.register('generateOfflineHtml') {
    inputs.files([sourceIndex, sourceCss, sourceV219Overlay, sourceV220Overlay] + sourceFragments)
    outputs.file(generatedOfflineAssetsDir.map { directory -> directory.file('index.html') })

    doLast {
        def missing = ([sourceIndex, sourceCss, sourceV219Overlay, sourceV220Overlay] + sourceFragments).findAll { file -> !file.isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException('缺少离线网页源码：' + missing.collect { it.path }.join(', '))
        }

        def index = sourceIndex.getText('UTF-8')
        def css = sourceCss.getText('UTF-8')
        def appParts = sourceFragments.collect { file -> file.getText('UTF-8') }
        def v219 = sourceV219Overlay.getText('UTF-8')
        def v220 = sourceV220Overlay.getText('UTF-8')
        def exportMarker = '  if (typeof globalThis !== "undefined") {'

        appParts[0] = appParts[0].replace('const APP_VERSION = "2.0";', 'const APP_VERSION = "2.20";')
        appParts[15] = appParts[15].replace('APP_VERSION: "2.18"', 'APP_VERSION: "2.20"')
        if (appParts[15].count(exportMarker) != 1 || v219.count(exportMarker) != 1 || v220.count(exportMarker) != 1) {
            throw new GradleException('V2.19或V2.20兼容层插入标记异常')
        }
        def combinedOverlay = v219.replace(exportMarker, v220)
        appParts[15] = appParts[15].replaceFirst(Pattern.quote(exportMarker), Matcher.quoteReplacement(combinedOverlay))
        def app = appParts.join('').replace('</script>', '<\\/script>')

        index = Pattern.compile('(?s)\\s*<link rel="manifest"[^>]*>\\s*')
            .matcher(index).replaceFirst('\n')
        index = Pattern.compile('(?s)\\s*<link rel="icon"[^>]*>\\s*')
            .matcher(index).replaceFirst('\n')
        index = Pattern.compile('<link rel="stylesheet"[^>]*>')
            .matcher(index).replaceFirst(Matcher.quoteReplacement('<style>\n' + css + '\n</style>'))
        index = Pattern.compile('<script src="app\\.js[^"]*"></script>')
            .matcher(index).replaceFirst(Matcher.quoteReplacement('<script>\n' + app + '\n</script>'))

        def required = [
            '<!doctype html',
            '心动训练营',
            'APP_VERSION = "2.20"',
            'V2.20 真实场景训练版',
            'ROLE_PERSONALITIES_V219',
            'REAL_SCENARIOS_V220',
            'getRealScenarioStatusV220',
            '</html>'
        ]
        if (index.getBytes('UTF-8').length < 225000 || !required.every { marker -> index.contains(marker) }) {
            throw new GradleException('Android V2.20离线页面生成失败或内容不完整')
        }
        if (index.contains('app.js?v=220') || index.contains('style.css?v=220')) {
            throw new GradleException('Android离线页面仍引用外部网页资源')
        }

        def outputDir = generatedOfflineAssetsDir.get().asFile
        if (!outputDir.exists() && !outputDir.mkdirs()) {
            throw new GradleException('无法创建 Android 离线资源目录')
        }
        def output = new File(outputDir, 'index.html')
        output.setText(index, 'UTF-8')
        println "Android V2.20 offline HTML generated: ${output.length()} bytes"
    }
}

android {
    namespace 'com.bianzhifeng.hearttraining'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bianzhifeng.hearttraining'
        minSdk 24
        targetSdk 35
        versionCode 220
        versionName '2.2.0'
    }

    sourceSets {
        main.assets.srcDirs = [generatedOfflineAssetsDir.get().asFile]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.matching { task -> task.name == 'preBuild' }.configureEach {
    dependsOn tasks.named('generateOfflineHtml')
}

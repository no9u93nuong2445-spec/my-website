name: Apply heart training V2.18

on:
  workflow_dispatch:
  push:
    branches: ['agent/heart-training-v218']
    paths:
      - 'v218-trigger.txt'
      - '.github/workflows/apply-v218.yml'
      - '.github/scripts/apply_v218.py'
      - '.github/scripts/build_android_webdata.py'
      - '.github/scripts/dialogue_v218_harness.js'

permissions:
  contents: write

concurrency:
  group: apply-heart-training-v218
  cancel-in-progress: true

jobs:
  apply-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Apply V2.18 source patch
        run: python3 .github/scripts/apply_v218.py

      - name: Rebuild Android offline webdata
        run: python3 .github/scripts/build_android_webdata.py

      - name: Build direct JavaScript and run regression tests
        run: |
          set -euo pipefail
          cp app.js /tmp/app-template-v218.js
          trap 'mv /tmp/app-template-v218.js app.js' EXIT
          cat fragments/app-{01..16}.txt > app.js
          node --check app.js
          node .github/scripts/dialogue_v218_harness.js | tee build-v218.log
          grep -Fq '全部通过：10/10' build-v218.log

      - name: Validate Android archive round trip
        run: |
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          parts = sorted(Path('webdata').glob('part-*.txt'))
          assert len(parts) == 12, len(parts)
          html = gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts)))
          assert len(html) > 200000
          assert b'APP_VERSION = "2.18"' in html
          assert '心动训练营'.encode() in html
          print(f'android archive PASS: {len(html)} bytes')
          PY

      - name: Build Android debug APK
        run: gradle -p app :app:assembleDebug --stacktrace

      - name: Check intended diff
        run: |
          git diff --check
          git status --short
          test "$(find webdata -maxdepth 1 -name 'part-*.txt' | wc -l)" -eq 12
          grep -q 'APP_VERSION = "2.18"' fragments/app-01.txt
          grep -q 'app.js?v=218' index.html
          grep -q "versionName '2.1.8'" app/app/build.gradle
          grep -q 'site-v2-1-8' app/app/src/main/java/com/bianzhifeng/hearttraining/ArchiveInstaller.java

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heart-training-v218-validation
          path: |
            build-v218.log
            app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Commit verified V2.18 source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            fragments/app-01.txt fragments/app-13.txt fragments/app-14.txt \
            index.html manifest.json sw.js README.md \
            app/app/build.gradle \
            app/app/src/main/java/com/bianzhifeng/hearttraining/ArchiveInstaller.java \
            .github/workflows/android.yml .github/workflows/verify.yml \
            webdata/part-*.txt
          if git diff --cached --quiet; then
            echo 'V2.18 source already present.'
          else
            git commit -m '修复连续对话与Android离线版本 V2.18 [skip ci]'
            git push origin HEAD:${{ github.ref_name }}
          fi

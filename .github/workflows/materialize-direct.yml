name: Materialize and verify direct web app

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/materialize-direct.yml'

permissions:
  contents: write

jobs:
  build-direct-site:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore the verified single-file application
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import io
          import json
          import pathlib
          import shutil
          import tarfile

          root = pathlib.Path.cwd()
          parts = sorted((root / '.bootstrap').glob('part-*.txt'))
          if len(parts) != 24:
              raise SystemExit(f'Expected 24 archive parts, found {len(parts)}')

          encoded = ''.join(''.join(p.read_text(encoding='ascii').split()) for p in parts)
          archive_bytes = base64.b64decode(encoded, validate=True)
          if archive_bytes[:2] != b'\x1f\x8b':
              raise SystemExit('Bootstrap archive is not gzip data')

          payload = gzip.decompress(archive_bytes)
          target = root / '_materialized'
          shutil.rmtree(target, ignore_errors=True)
          target.mkdir()

          # The bootstrap package is a TAR payload. Keep a raw-HTML fallback
          # so a future source-package change cannot silently break deployment.
          candidates = []
          try:
              with tarfile.open(fileobj=io.BytesIO(payload), mode='r:') as tf:
                  base = target.resolve()
                  for member in tf.getmembers():
                      resolved = (target / member.name).resolve()
                      if resolved != base and base not in resolved.parents:
                          raise SystemExit(f'Unsafe archive path: {member.name}')
                  tf.extractall(target)
              candidates.extend(target.rglob('心动训练营_离线单文件版_V2.0.html'))
              candidates.extend(p for p in target.rglob('*.html') if p.stat().st_size > 280000)
          except tarfile.TarError:
              raw = payload.decode('utf-8')
              fallback = target / '心动训练营_离线单文件版_V2.0.html'
              fallback.write_text(raw, encoding='utf-8')
              candidates.append(fallback)

          unique = {p.resolve(): p for p in candidates}
          if not unique:
              raise SystemExit('Complete single-file HTML was not found in bootstrap package')
          source = max(unique.values(), key=lambda p: p.stat().st_size)
          html = source.read_text(encoding='utf-8')

          required = [
              '<!doctype html>',
              'const TOTAL_LEVELS = 45',
              'function sendMessage()',
              '自由练习设置',
              '先理解，再到关卡里练出来',
              '个人训练诊断',
              '显示与手机体验'
          ]
          missing = [item for item in required if item not in html]
          html_bytes = html.encode('utf-8')
          if len(html_bytes) < 300000 or missing:
              raise SystemExit(f'HTML verification failed: bytes={len(html_bytes)}, missing={missing}')
          if html.count('<script') != html.count('</script>'):
              raise SystemExit('Unbalanced script tags')
          if html.count('<style') != html.count('</style>'):
              raise SystemExit('Unbalanced style tags')

          # Keep the production page self-contained. Add the PWA manifest only
          # when the source file does not already include one.
          if 'rel="manifest"' not in html:
              html = html.replace('</head>', '<link rel="manifest" href="./manifest.json?v=212" /></head>', 1)
          root.joinpath('index.html').write_text(html, encoding='utf-8')

          script_start = html.find('<script>')
          script_end = html.rfind('</script>')
          if script_start < 0 or script_end <= script_start:
              raise SystemExit('Inline application script was not found')
          script = html[script_start + len('<script>'):script_end]
          root.joinpath('_verified-app.js').write_text(script, encoding='utf-8')

          manifest = {
              'name': '心动训练营 V2.0',
              'short_name': '心动训练营',
              'description': '完全离线的恋爱沟通与聊天闯关训练工具',
              'lang': 'zh-CN',
              'start_url': './?source=pwa&v=212',
              'scope': './',
              'display': 'standalone',
              'background_color': '#f6f3ff',
              'theme_color': '#7c3aed',
              'orientation': 'portrait-primary',
              'icons': [{'src':'./icon.svg?v=212','sizes':'any','type':'image/svg+xml','purpose':'any maskable'}]
          }
          root.joinpath('manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          sw = """const CACHE='heart-training-direct-v212';
          const CORE=['./','./index.html','./manifest.json','./icon.svg'];
          self.addEventListener('install',event=>event.waitUntil(caches.open(CACHE).then(cache=>cache.addAll(CORE)).then(()=>self.skipWaiting())));
          self.addEventListener('activate',event=>event.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(key=>key!==CACHE).map(key=>caches.delete(key)))).then(()=>self.clients.claim())));
          self.addEventListener('fetch',event=>{if(event.request.method!=='GET')return;event.respondWith(fetch(event.request,{cache:'no-store'}).then(response=>{if(response.ok)caches.open(CACHE).then(cache=>cache.put(event.request,response.clone()));return response}).catch(()=>caches.match(event.request,{ignoreSearch:true}).then(response=>response||(event.request.mode==='navigate'?caches.match('./index.html'):undefined))))});
          """
          root.joinpath('sw.js').write_text(sw, encoding='utf-8')
          root.joinpath('.nojekyll').write_text('', encoding='utf-8')

          verify = {
              'mode': 'direct-single-html',
              'source': str(source.relative_to(target)),
              'html_bytes': len(html_bytes),
              'sha256': hashlib.sha256(html_bytes).hexdigest(),
              'levels': 45,
              'archive_parts': len(parts),
              'checks': ['source markers', 'balanced tags', 'node syntax', 'chrome rendered DOM']
          }
          root.joinpath('DEPLOY_VERIFIED.json').write_text(json.dumps(verify, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Check JavaScript syntax
        run: node --check _verified-app.js

      - name: Start local web server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/heart-http.log 2>&1 &
          echo $! > /tmp/heart-http.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0
            sleep 0.5
          done
          cat /tmp/heart-http.log
          exit 1

      - name: Open with real Chrome and verify rendered application
        run: |
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --user-data-dir=/tmp/heart-chrome --virtual-time-budget=10000 \
            --dump-dom http://127.0.0.1:8765/ > /tmp/rendered.html
          grep -q '心动训练营' /tmp/rendered.html
          grep -q '自由练习' /tmp/rendered.html
          grep -q '课程' /tmp/rendered.html
          grep -q '报告' /tmp/rendered.html
          grep -q '设置' /tmp/rendered.html
          LEVEL_COUNT="$(grep -o 'class=\"level-card' /tmp/rendered.html | wc -l | tr -d ' ')"
          NAV_COUNT="$(grep -o 'class=\"nav-item' /tmp/rendered.html | wc -l | tr -d ' ')"
          echo "Rendered levels: $LEVEL_COUNT"
          echo "Rendered navigation items: $NAV_COUNT"
          test "$LEVEL_COUNT" -eq 45
          test "$NAV_COUNT" -eq 5
          ! grep -q '载入失败' /tmp/rendered.html
          ! grep -q '程序数据校验失败' /tmp/rendered.html

      - name: Commit only after all verification succeeds
        run: |
          rm -rf _materialized _verified-app.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html manifest.json sw.js DEPLOY_VERIFIED.json .nojekyll
          if git diff --cached --quiet; then
            echo 'Verified direct application is already current.'
          else
            git commit -m '部署浏览器验证通过的完整单文件网页 [skip ci]'
            git push
          fi

name: Apply dialogue upgrade V2.17

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'v217-main-trigger.txt'
      - '.github/workflows/apply-v217.yml'
      - '.github/scripts/apply_v217.py'
      - '.github/scripts/dialogue_v217_harness.js'
  pull_request:
    branches: [main]
    paths:
      - 'verify-trigger-v217.txt'
      - '.github/workflows/apply-v217.yml'
      - '.github/scripts/apply_v217.py'
      - '.github/scripts/dialogue_v217_harness.js'

permissions:
  contents: write

concurrency:
  group: apply-dialogue-v217
  cancel-in-progress: true

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare focused regression harness
        run: |
          rm -rf tests
          mkdir -p tests
          cp .github/scripts/dialogue_v217_harness.js tests/dialogue.test.js

      - name: Apply V2.17 patch
        run: python3 .github/scripts/apply_v217.py

      - name: Build and test direct application
        run: |
          cp app.js /tmp/app-template-v217.js
          cat fragments/app-{01..16}.txt > app.js
          node --check app.js
          output="$(node tests/dialogue.test.js 2>&1)"
          echo "$output"
          count="$(printf '%s\n' "$output" | sed -n 's/.*全部通过：\([0-9][0-9]*\)\/.*/\1/p' | tail -1)"
          test "$count" = "6"
          mv /tmp/app-template-v217.js app.js
          rm -rf tests

      - name: Commit verified source to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fragments/app-01.txt fragments/app-02.txt fragments/app-13.txt fragments/app-14.txt fragments/app-15.txt fragments/app-16.txt index.html manifest.json sw.js
          if git diff --cached --quiet; then
            echo 'Verified V2.17 source already present.'
          else
            git commit -m '优化角色接话与低分对话续接 V2.17 [skip ci]'
            git push origin main
          fi

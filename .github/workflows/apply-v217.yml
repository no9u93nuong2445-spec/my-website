name: Apply dialogue upgrade V2.17

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'v217-main-trigger.txt'
      - '.github/workflows/apply-v217.yml'
      - '.github/scripts/apply_v217.py'
      - '.github/scripts/dialogue_v217_harness.js'
  pull_request:
    branches: [main]
    paths:
      - 'verify-trigger-v217.txt'
      - '.github/workflows/apply-v217.yml'
      - '.github/scripts/apply_v217.py'
      - '.github/scripts/dialogue_v217_harness.js'

permissions:
  contents: write

concurrency:
  group: apply-dialogue-v217
  cancel-in-progress: true

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare focused regression harness
        run: |
          rm -rf tests
          mkdir -p tests
          cp .github/scripts/dialogue_v217_harness.js tests/dialogue.test.js

      - name: Apply V2.17 patch
        run: python3 .github/scripts/apply_v217.py

      - name: Build and test direct application
        id: build_test
        run: |
          set +e
          cp app.js /tmp/app-template-v217.js
          cat fragments/app-{01..16}.txt > app.js
          {
            echo '=== NODE SYNTAX ==='
            node --check app.js
            syntax_rc=$?
            echo "syntax_rc=$syntax_rc"
            echo '=== DIALOGUE TESTS ==='
            node tests/dialogue.test.js
            test_rc=$?
            echo "test_rc=$test_rc"
          } > build-v217.log 2>&1
          cat build-v217.log
          cp app.js app-v217-generated.js
          mv /tmp/app-template-v217.js app.js
          rm -rf tests
          grep -Fq 'syntax_rc=0' build-v217.log && grep -Fq '全部通过：6/6' build-v217.log

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apply-v217-build-evidence
          path: |
            build-v217.log
            app-v217-generated.js
          if-no-files-found: ignore

      - name: Commit verified source to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fragments/app-01.txt fragments/app-02.txt fragments/app-13.txt fragments/app-14.txt fragments/app-15.txt fragments/app-16.txt index.html manifest.json sw.js
          if git diff --cached --quiet; then
            echo 'Verified V2.17 source already present.'
          else
            git commit -m '优化角色接话与低分对话续接 V2.17 [skip ci]'
            git push origin main
          fi

name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "fragments/**"
      - "index.html"
      - "style.css"
      - ".github/scripts/dialogue_v218_harness.js"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "fragments/**"
      - "index.html"
      - "style.css"
      - ".github/scripts/dialogue_v218_harness.js"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate dialogue engine
        run: |
          set -euo pipefail
          cp app.js /tmp/app-template.js
          trap 'mv /tmp/app-template.js app.js' EXIT
          cat fragments/app-{01..16}.txt > app.js
          node --check app.js
          node .github/scripts/dialogue_v218_harness.js | tee android-dialogue-test.log
          grep -Fq '全部通过：10/10' android-dialogue-test.log

      - name: Build debug APK
        run: gradle -p app :app:assembleDebug --stacktrace

      - name: Validate generated offline page
        run: |
          set -euo pipefail
          PAGE='app/app/build/generated/offlineAssets/index.html'
          test -s "$PAGE"
          test "$(wc -c < "$PAGE")" -gt 200000
          grep -q 'APP_VERSION = "2.18"' "$PAGE"
          grep -q 'V2.18 离线正式版' "$PAGE"
          ! grep -q 'app.js?v=218' "$PAGE"
          ! grep -q 'style.css?v=218' "$PAGE"
          grep -q "versionName '2.1.8'" app/app/build.gradle
          grep -q 'site-v2-1-8' app/app/src/main/java/com/bianzhifeng/hearttraining/ArchiveInstaller.java

      - name: Upload APK and validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: heart-training-v218-debug-apk
          path: |
            app/app/build/outputs/apk/debug/app-debug.apk
            app/app/build/generated/offlineAssets/index.html
            android-dialogue-test.log
          if-no-files-found: error

name: Verify offline package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate V2.20 source and privacy
        shell: bash
        run: |
          set -euo pipefail

          # .bootstrap 只作为历史恢复资料保留，不参与当前网页或 APK 构建。
          test "$(find .bootstrap -maxdepth 1 -name 'part-*.txt' | wc -l)" -eq 24
          test "$(find .bootstrap -maxdepth 1 -name 'part-*.txt' -size +0c | wc -l)" -eq 24

          grep -q 'V2.20 真实场景训练版' index.html
          grep -q 'app.js?v=220' index.html
          grep -q 'app-v219-overlay.txt' app.js
          grep -q 'app-v220-overlay.txt' app.js
          grep -q 'ROLE_PERSONALITIES_V219' fragments/app-v219-overlay.txt
          grep -q 'REAL_SCENARIOS_V220' fragments/app-v220-overlay.txt
          grep -q 'getRealScenarioStatusV220' fragments/app-v220-overlay.txt
          grep -q 'relationshipCooling' fragments/app-v220-overlay.txt
          grep -q "versionName '2.2.0'" app/app/build.gradle
          grep -q "versionCode 220" app/app/build.gradle
          grep -q "generateOfflineHtml" app/app/build.gradle
          grep -q "site-v2-2-0" app/app/src/main/java/com/bianzhifeng/hearttraining/ArchiveInstaller.java
          grep -q 'getAssets().open(ASSET_INDEX)' app/app/src/main/java/com/bianzhifeng/hearttraining/ArchiveInstaller.java
          ! grep -q "main.assets.srcDirs = \['../../webdata'\]" app/app/build.gradle
          ! grep -R '<uses-permission' app/app/src/main/AndroidManifest.xml
          echo 'V2.20 source and privacy: PASS'

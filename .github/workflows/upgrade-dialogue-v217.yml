name: Upgrade dialogue continuity V2.17

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'verify-trigger-v217.txt'
      - '.github/workflows/upgrade-dialogue-v217.yml'

permissions:
  contents: write

concurrency:
  group: upgrade-dialogue-v217
  cancel-in-progress: true


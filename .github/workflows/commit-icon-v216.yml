name: Commit verified icon V2.16

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'icon-trigger-v216.txt'
      - '.github/workflows/commit-icon-v216.yml'

permissions:
  contents: write

jobs:
  commit-icon:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Decode and verify icon
        run: |
          mkdir -p assets
          cat > /tmp/icon.b64 <<'EOF'
          
          EOF
          tr -d '[:space:]' < /tmp/icon.b64 | base64 -d > assets/icon-192.png
          test "$(sha256sum assets/icon-192.png | awk '{print $1}')" = "8d9c7d6e28067c2c1771a4afc08902d3a0b4087e1d642abc0e7292e72816d5b0"
          test "$(wc -c < assets/icon-192.png)" = "1196"
      - name: Commit icon to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/icon-192.png
          if ! git diff --cached --quiet; then
            git commit -m '添加V2.16已校验应用图标 [skip ci]'
            git push origin HEAD:main
          fi
